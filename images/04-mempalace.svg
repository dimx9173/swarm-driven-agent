<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1a0a2a"/>
      <stop offset="40%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="palaceFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0a3a"/>
      <stop offset="50%" stop-color="#0a0520"/>
      <stop offset="100%" stop-color="#1a0a3a"/>
    </linearGradient>
    <linearGradient id="palaceSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0a3a"/>
      <stop offset="100%" stop-color="#0a0218"/>
    </linearGradient>
    <linearGradient id="palaceRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <radialGradient id="domeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="brick" x="0" y="0" width="20" height="10" patternUnits="userSpaceOnUse">
      <rect width="20" height="10" fill="#0a0520"/>
      <line x1="0" y1="0" x2="20" y2="0" stroke="#1a0a3a" stroke-width="0.5"/>
      <line x1="10" y1="0" x2="10" y2="10" stroke="#1a0a3a" stroke-width="0.5"/>
    </pattern>

    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg4)"/>

  <!-- Moon -->
  <g transform="translate(1000 150)">
    <circle r="60" fill="#fef3c7" opacity="0.15" filter="url(#bigGlow4)"/>
    <circle r="40" fill="#fef3c7" opacity="0.85" filter="url(#glow4)"/>
    <circle cx="-12" cy="-8" r="6" fill="#1a0a3a" opacity="0.3"/>
    <circle cx="10" cy="6" r="4" fill="#1a0a3a" opacity="0.3"/>
    <circle cx="-4" cy="14" r="3" fill="#1a0a3a" opacity="0.3"/>
  </g>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="150" cy="100" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="180" r="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="80" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="550" cy="150" r="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="100" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="220" r="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="280" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="350" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="450" r="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Title -->
  <g filter="url(#glow4)">
    <text x="600" y="55" text-anchor="middle" fill="#e9d5ff" font-size="30" font-weight="700" letter-spacing="8">MEMPALACE</text>
    <text x="600" y="82" text-anchor="middle" fill="#c084fc" font-size="12" letter-spacing="6" opacity="0.85">KNOWLEDGE PALACE · WINGS · ROOMS · DRAWERS · TUNNELS</text>
  </g>

  <!-- Glowing aura behind palace -->
  <ellipse cx="600" cy="500" rx="380" ry="180" fill="url(#domeGlow)" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- PALACE: 3D isometric cathedral -->
  <g transform="translate(600 480)">
    <!-- Side wall (right perspective) -->
    <polygon points="-150,-50 150,-50 220,30 -80,30" fill="url(#palaceSide)" stroke="#c084fc" stroke-width="1" opacity="0.85"/>
    <polygon points="-150,-50 150,-50 220,30 -80,30" fill="url(#brick)" opacity="0.4"/>

    <!-- Front wall -->
    <polygon points="-150,-50 150,-50 150,180 -150,180" fill="url(#palaceFront)" stroke="#c084fc" stroke-width="1.5" filter="url(#glow4)"/>
    <polygon points="-150,-50 150,-50 150,180 -150,180" fill="url(#brick)" opacity="0.3"/>

    <!-- Left tower -->
    <rect x="-200" y="-110" width="50" height="290" fill="url(#palaceFront)" stroke="#c084fc" stroke-width="1.5" filter="url(#glow4)"/>
    <polygon points="-225,-110 -175,-110 -200,-180" fill="url(#palaceRoof)" stroke="#c084fc" stroke-width="1.5" filter="url(#glow4)"/>

    <!-- Right tower -->
    <rect x="150" y="-110" width="50" height="290" fill="url(#palaceFront)" stroke="#c084fc" stroke-width="1.5" filter="url(#glow4)"/>
    <polygon points="125,-110 225,-110 175,-180" fill="url(#palaceRoof)" stroke="#c084fc" stroke-width="1.5" filter="url(#glow4)"/>

    <!-- Central dome -->
    <ellipse cx="0" cy="-50" rx="80" ry="100" fill="url(#palaceFront)" stroke="#c084fc" stroke-width="1.5" filter="url(#glow4)"/>
    <ellipse cx="0" cy="-50" rx="80" ry="100" fill="url(#domeGlow)" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <polygon points="0,-180 -25,-150 25,-150" fill="url(#palaceRoof)" stroke="#c084fc" stroke-width="1.5" filter="url(#glow4)"/>
    <line x1="0" y1="-180" x2="0" y2="-220" stroke="#fbbf24" stroke-width="2" filter="url(#glow4)"/>
    <circle cx="0" cy="-225" r="4" fill="#fbbf24" filter="url(#bigGlow4)">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Door arch -->
    <path d="M-30,180 L-30,90 Q-30,50 0,50 Q30,50 30,90 L30,180 Z" fill="#000000" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow4)"/>
    <path d="M-25,175 L-25,95 Q-25,55 0,55 Q25,55 25,95 L25,175 Z" fill="url(#domeGlow)" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
    </path>

    <!-- Windows -->
    <g stroke="#fbbf24" stroke-width="1" filter="url(#glow4)">
      <rect x="-110" y="0" width="20" height="40" fill="#fbbf24" opacity="0.2">
        <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="-70" y="0" width="20" height="40" fill="#fbbf24" opacity="0.2">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="50" y="0" width="20" height="40" fill="#fbbf24" opacity="0.2">
        <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="90" y="0" width="20" height="40" fill="#fbbf24" opacity="0.2">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Tower windows -->
    <g fill="#fbbf24" filter="url(#glow4)">
      <circle cx="-175" cy="-50" r="4">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-175" cy="0" r="4">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="175" cy="-50" r="4">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="175" cy="0" r="4">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Steps -->
    <polygon points="-80,180 80,180 100,200 -100,200" fill="#1a0a3a" stroke="#c084fc" stroke-width="1"/>
    <polygon points="-100,200 100,200 120,220 -120,220" fill="#0a0520" stroke="#c084fc" stroke-width="1"/>
  </g>

  <!-- Floating knowledge orbs (wings) -->
  <g filter="url(#glow4)">
    <g transform="translate(180 280)">
      <circle r="30" fill="url(#orbGrad)"/>
      <text text-anchor="middle" y="3" fill="#ffffff" font-size="11" font-weight="700">W1</text>
      <text y="50" text-anchor="middle" fill="#c084fc" font-size="9" letter-spacing="1.5">backend</text>
    </g>
    <g transform="translate(1020 280)">
      <circle r="30" fill="url(#orbGrad)"/>
      <text text-anchor="middle" y="3" fill="#ffffff" font-size="11" font-weight="700">W2</text>
      <text y="50" text-anchor="middle" fill="#c084fc" font-size="9" letter-spacing="1.5">decisions</text>
    </g>
    <g transform="translate(150 500)">
      <circle r="30" fill="url(#orbGrad)"/>
      <text text-anchor="middle" y="3" fill="#ffffff" font-size="11" font-weight="700">W3</text>
      <text y="50" text-anchor="middle" fill="#c084fc" font-size="9" letter-spacing="1.5">meetings</text>
    </g>
    <g transform="translate(1050 500)">
      <circle r="30" fill="url(#orbGrad)"/>
      <text text-anchor="middle" y="3" fill="#ffffff" font-size="11" font-weight="700">W4</text>
      <text y="50" text-anchor="middle" fill="#c084fc" font-size="9" letter-spacing="1.5">anti-patterns</text>
    </g>
    <g transform="translate(250 720)">
      <circle r="25" fill="url(#orbGrad)"/>
      <text text-anchor="middle" y="3" fill="#ffffff" font-size="9" font-weight="700">W5</text>
      <text y="42" text-anchor="middle" fill="#c084fc" font-size="8">specs</text>
    </g>
    <g transform="translate(950 720)">
      <circle r="25" fill="url(#orbGrad)"/>
      <text text-anchor="middle" y="3" fill="#ffffff" font-size="9" font-weight="700">W6</text>
      <text y="42" text-anchor="middle" fill="#c084fc" font-size="8">prompts</text>
    </g>
  </g>

  <!-- Tunnels (lines connecting orbs to palace) -->
  <g fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="4 3" opacity="0.7" filter="url(#glow4)">
    <path d="M210,280 Q380,300 460,420"/>
    <path d="M990,280 Q820,300 740,420"/>
    <path d="M180,500 Q350,500 450,500"/>
    <path d="M1020,500 Q850,500 750,500"/>
    <path d="M275,720 Q420,680 530,620"/>
    <path d="M925,720 Q780,680 670,620"/>
  </g>

  <!-- Drawer indicators floating out of palace -->
  <g filter="url(#glow4)">
    <g transform="translate(380 200)">
      <rect x="-30" y="-10" width="60" height="20" rx="3" fill="#1a0a3a" stroke="#fbbf24" stroke-width="1"/>
      <circle cx="-20" cy="0" r="2" fill="#fbbf24"/>
      <text x="-12" y="3" fill="#fde68a" font-size="7">drawer</text>
    </g>
    <g transform="translate(820 200)">
      <rect x="-30" y="-10" width="60" height="20" rx="3" fill="#1a0a3a" stroke="#fbbf24" stroke-width="1"/>
      <circle cx="-20" cy="0" r="2" fill="#fbbf24"/>
      <text x="-12" y="3" fill="#fde68a" font-size="7">room</text>
    </g>
  </g>

  <!-- Bottom info -->
  <g transform="translate(600 800)">
    <text text-anchor="middle" fill="#c084fc" font-size="11" letter-spacing="2" font-weight="600">🜂 DRAWER · ROOM · WING · TUNNEL · HALLWAY · KG-FACTS · AAAK MEMORY 🜂</text>
    <text y="22" text-anchor="middle" fill="#a78bfa" font-size="9" opacity="0.7">mempalace_mine · mempalace_search · mempalace_kg_add · mempalace_traverse</text>
    <text y="42" text-anchor="middle" fill="#c084fc" font-size="9" opacity="0.6">EVERY REJECTED CRUCIBLE = ANTI-PATTERN DRAWER FOR FEW-SHOT LEARNING</text>
  </g>

  <!-- Corner frame -->
  <g stroke="#c084fc" stroke-width="1" fill="none" opacity="0.4">
    <path d="M30,30 L30,80 M30,30 L80,30"/>
    <path d="M1170,30 L1170,80 M1170,30 L1120,30"/>
    <path d="M30,870 L30,820 M30,870 L80,870"/>
    <path d="M1170,870 L1170,820 M1170,870 L1120,870"/>
  </g>
</svg>
