<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="50%" stop-color="#0a0202"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <radialGradient id="blueFire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#93c5fd"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="85%" stop-color="#1e3a8a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redFire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fecaca"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="85%" stop-color="#7f1d1d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="sword" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="redSword" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <radialGradient id="specGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg2)"/>

  <!-- Background embers -->
  <g fill="#ff6b35">
    <circle cx="150" cy="700" r="1.2" opacity="0.8">
      <animate attributeName="cy" from="700" to="100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="720" r="1" opacity="0.6">
      <animate attributeName="cy" from="720" to="120" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="740" r="0.8" opacity="0.7">
      <animate attributeName="cy" from="740" to="100" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="730" r="1" opacity="0.6">
      <animate attributeName="cy" from="730" to="80" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="0.6" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="710" r="1.2" opacity="0.8">
      <animate attributeName="cy" from="710" to="60" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="0.8" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="700" r="0.9" opacity="0.6">
      <animate attributeName="cy" from="700" to="40" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <g filter="url(#glow2)">
    <text x="600" y="70" text-anchor="middle" fill="#fde68a" font-size="34" font-weight="700" letter-spacing="8">THE CRUCIBLE</text>
    <text x="600" y="98" text-anchor="middle" fill="#dc2626" font-size="13" letter-spacing="6" opacity="0.9">BUILDER × DESTROYER // ADVERSARIAL SPEC FORGE</text>
  </g>

  <!-- The Spec / Anvil in the center -->
  <g transform="translate(600 420)">
    <!-- Anvil base glow -->
    <circle r="160" fill="url(#specGlow)" opacity="0.5">
      <animate attributeName="r" values="155;175;155" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- The specification document -->
    <g filter="url(#glow2)">
      <rect x="-90" y="-110" width="180" height="220" rx="6" fill="#1a0a0a" stroke="#fbbf24" stroke-width="1.8"/>
      <rect x="-86" y="-106" width="172" height="212" rx="4" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.5"/>
      <text x="0" y="-85" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="2">SPEC.md</text>
      <line x1="-70" y1="-70" x2="70" y2="-70" stroke="#fbbf24" stroke-width="0.5" opacity="0.4"/>
      <text x="-72" y="-50" fill="#fde68a" font-size="7" opacity="0.8">├ Data Flow</text>
      <text x="-72" y="-35" fill="#fde68a" font-size="7" opacity="0.8">├ Interface Contract</text>
      <text x="-72" y="-20" fill="#fde68a" font-size="7" opacity="0.8">├ Acceptance Criteria</text>
      <text x="-72" y="-5" fill="#fde68a" font-size="7" opacity="0.8">├ Risk Assessment</text>
      <text x="-72" y="10" fill="#fde68a" font-size="7" opacity="0.8">├ ADR (Context / Decision)</text>
      <text x="-72" y="25" fill="#fde68a" font-size="7" opacity="0.8">├ TDD Test Plan</text>
      <text x="-72" y="45" fill="#fde68a" font-size="7" opacity="0.8">├ Error Handling</text>
      <text x="-72" y="60" fill="#fde68a" font-size="7" opacity="0.8">└ Rollback Strategy</text>

      <line x1="-70" y1="80" x2="70" y2="80" stroke="#fbbf24" stroke-width="0.5" opacity="0.4"/>
      <text x="0" y="98" text-anchor="middle" fill="#fbbf24" font-size="8" letter-spacing="2">— HASH ANCHORED —</text>
    </g>

    <!-- Impact sparks -->
    <g stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" filter="url(#glow2)">
      <line x1="0" y1="-130" x2="0" y2="-160">
        <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="35" y1="-128" x2="50" y2="-150">
        <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
      </line>
      <line x1="-35" y1="-128" x2="-50" y2="-150">
        <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      </line>
      <line x1="60" y1="-115" x2="85" y2="-130">
        <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="-60" y1="-115" x2="-85" y2="-130">
        <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- BUILDER side (left) -->
  <g transform="translate(220 420)">
    <!-- Aura -->
    <circle r="120" fill="url(#blueFire)" opacity="0.6">
      <animate attributeName="r" values="115;130;115" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer ring -->
    <circle r="100" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 3"/>

    <!-- Hexagon shield -->
    <g filter="url(#glow2)" stroke="#3b82f6" stroke-width="2" fill="#0a0a1f">
      <polygon points="0,-85 73,-43 73,43 0,85 -73,43 -73,-43"/>
      <polygon points="0,-65 56,-32 56,32 0,65 -56,32 -56,-32" fill="none" stroke="#60a5fa" stroke-width="0.8" opacity="0.6"/>
    </g>

    <!-- Builder icon: hammer / anvil -->
    <g fill="#bfdbfe" filter="url(#glow2)">
      <rect x="-22" y="-30" width="44" height="14" rx="2"/>
      <rect x="-5" y="-16" width="10" height="46" rx="2"/>
    </g>

    <!-- Label -->
    <text y="125" text-anchor="middle" fill="#bfdbfe" font-size="22" font-weight="700" letter-spacing="4" filter="url(#glow2)">BUILDER</text>
    <text y="148" text-anchor="middle" fill="#3b82f6" font-size="11" letter-spacing="2">ARCHITECT · ADR · SPEC</text>
    <text y="166" text-anchor="middle" fill="#60a5fa" font-size="9" opacity="0.7">Heterogeneous model · Creator path</text>
  </g>

  <!-- DESTROYER side (right) -->
  <g transform="translate(980 420)">
    <!-- Aura -->
    <circle r="120" fill="url(#redFire)" opacity="0.6">
      <animate attributeName="r" values="115;130;115" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer ring -->
    <circle r="100" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 3"/>

    <!-- Crossed swords emblem -->
    <g filter="url(#glow2)">
      <!-- Sword 1 -->
      <g transform="rotate(45)">
        <rect x="-2" y="-60" width="4" height="120" fill="url(#redSword)"/>
        <polygon points="0,-72 -4,-60 4,-60" fill="#fecaca"/>
        <rect x="-12" y="55" width="24" height="6" fill="#7f1d1d"/>
        <rect x="-2" y="61" width="4" height="10" fill="#7f1d1d"/>
      </g>
      <!-- Sword 2 -->
      <g transform="rotate(-45)">
        <rect x="-2" y="-60" width="4" height="120" fill="url(#redSword)"/>
        <polygon points="0,-72 -4,-60 4,-60" fill="#fecaca"/>
        <rect x="-12" y="55" width="24" height="6" fill="#7f1d1d"/>
        <rect x="-2" y="61" width="4" height="10" fill="#7f1d1d"/>
      </g>
    </g>

    <!-- Label -->
    <text y="125" text-anchor="middle" fill="#fecaca" font-size="22" font-weight="700" letter-spacing="4" filter="url(#glow2)">DESTROYER</text>
    <text y="148" text-anchor="middle" fill="#dc2626" font-size="11" letter-spacing="2">RED TEAM · CRITIQUE</text>
    <text y="166" text-anchor="middle" fill="#f87171" font-size="9" opacity="0.7">Leniency bias mitigation</text>
  </g>

  <!-- Combat energy beam between -->
  <g>
    <line x1="295" y1="420" x2="500" y2="420" stroke="#3b82f6" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="700" y1="420" x2="905" y2="420" stroke="#dc2626" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <!-- Collision sparks at spec -->
    <g fill="#fbbf24" filter="url(#bigGlow2)">
      <circle cx="600" cy="380" r="2"><animate attributeName="cy" values="380;320;380" dur="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="460" r="2"><animate attributeName="cy" values="460;520;460" dur="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="420" r="1.5"><animate attributeName="cx" values="560;500;560" dur="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="420" r="1.5"><animate attributeName="cx" values="640;700;640" dur="0.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- Attack checklist left (Builder defends) -->
  <g transform="translate(220 250)" fill="#bfdbfe" font-size="9" opacity="0.85">
    <text x="0" y="0" font-weight="700" letter-spacing="2" fill="#60a5fa">BUILD BLOCKS</text>
    <text x="0" y="18">◆ Data Flow</text>
    <text x="0" y="32">◆ Interface Contract</text>
    <text x="0" y="46">◆ Pseudocode</text>
    <text x="0" y="60">◆ Error Handling</text>
    <text x="0" y="74">◆ TDD Test Plan</text>
  </g>

  <!-- Attack vectors right (Destroyer attacks) -->
  <g transform="translate(980 250)" fill="#fecaca" font-size="9" text-anchor="end" opacity="0.85">
    <text x="0" y="0" font-weight="700" letter-spacing="2" fill="#f87171">CRUCIBLE ATTACKS</text>
    <text x="0" y="18">⚔ Deadlock · Race Condition</text>
    <text x="0" y="32">⚔ Silent Failure Paths</text>
    <text x="0" y="46">⚔ Resource Leak · O(n²)</text>
    <text x="0" y="60">⚔ Injection · Data Exposure</text>
    <text x="0" y="74">⚔ Unhandled Exceptions</text>
  </g>

  <!-- Round counter -->
  <g transform="translate(600 220)">
    <circle cx="0" cy="0" r="30" fill="#1a0a0a" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow2)"/>
    <text y="-3" text-anchor="middle" fill="#fbbf24" font-size="9" letter-spacing="1.5">ROUND</text>
    <text y="13" text-anchor="middle" fill="#fde68a" font-size="16" font-weight="700">
      1 / 3
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Score formula -->
  <g transform="translate(600 600)">
    <rect x="-180" y="-25" width="360" height="50" rx="6" fill="#0a0a1f" stroke="#fbbf24" stroke-width="1" opacity="0.85"/>
    <text x="0" y="-5" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="700" letter-spacing="1.5">AUTORUBRIC SCORE GATE</text>
    <text x="0" y="15" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700" font-style="italic">S = Σ wᵢ · cᵢ  (negative wᵢ = anti-pattern penalty)</text>
  </g>

  <!-- Circuit breaker footer -->
  <g transform="translate(600 700)">
    <text text-anchor="middle" fill="#dc2626" font-size="11" letter-spacing="3" font-weight="700">⚡ CIRCUIT BREAKER · 3-ROUND LIMIT · HALT + ESCALATE TO HITL ⚡</text>
    <text y="22" text-anchor="middle" fill="#f87171" font-size="9" opacity="0.7">PASSED → SYNTHESIS (Phase 5) · FAILED → Trade-off Matrix → Human Architect</text>
  </g>

  <!-- Decorative corners -->
  <g stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.4">
    <path d="M40,40 L40,80 M40,40 L80,40"/>
    <path d="M1160,40 L1160,80 M1160,40 L1120,40"/>
    <path d="M40,760 L40,720 M40,760 L80,760"/>
    <path d="M1160,760 L1160,720 M1160,760 L1120,760"/>
  </g>
</svg>
