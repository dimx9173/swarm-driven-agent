<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0a0a2a"/>
      <stop offset="50%" stop-color="#050518"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Phase gradients -->
    <linearGradient id="p1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="p2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="p3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="p4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="p5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5b8cff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="2.5s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="circuit" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 40 L20 40 L20 20 L40 20 M40 40 L60 40 L60 60 L80 60" stroke="#1a1a3a" stroke-width="0.5" fill="none" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1400" height="900" fill="url(#bg3)"/>
  <rect width="1400" height="900" fill="url(#circuit)"/>

  <!-- Title -->
  <g filter="url(#glow3)">
    <text x="700" y="60" text-anchor="middle" fill="#a0e9ff" font-size="32" font-weight="700" letter-spacing="8">FINITE STATE MACHINE</text>
    <text x="700" y="90" text-anchor="middle" fill="#5b8cff" font-size="13" letter-spacing="6" opacity="0.9">SOUL COGNITIVE RUNTIME · 6 HOOKS · STRICT XML BOUNDARIES</text>
  </g>

  <!-- Phase 1: INTENT_GATE (top-left, small entry) -->
  <g transform="translate(140 200)">
    <circle r="42" fill="url(#p5)" filter="url(#glow3)"/>
    <circle r="34" fill="#0a0a1f" stroke="#fda4af" stroke-width="1.5"/>
    <text y="-3" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="700">IG</text>
    <text y="13" text-anchor="middle" fill="#fda4af" font-size="7" letter-spacing="1">[INTENT_GATE]</text>
    <text y="60" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="600">Intent Classification</text>
    <text y="75" text-anchor="middle" fill="#fda4af" font-size="8" opacity="0.8">USE_SWARM_WORKFLOW?</text>
  </g>

  <!-- Phase 1: DESTRUCT -->
  <g transform="translate(320 240)">
    <rect x="-75" y="-55" width="150" height="110" rx="10" fill="url(#p1)" filter="url(#glow3)"/>
    <rect x="-70" y="-50" width="140" height="100" rx="8" fill="#0a0a1f" stroke="#a78bfa" stroke-width="1.5"/>
    <text y="-25" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="700" letter-spacing="1.5">PHASE 1</text>
    <text y="-5" text-anchor="middle" fill="#c4b5fd" font-size="16" font-weight="700">DESTRUCT</text>
    <text y="15" text-anchor="middle" fill="#a78bfa" font-size="8" letter-spacing="1.5">[PHASE_1_DESTRUCT]</text>
    <text y="35" text-anchor="middle" fill="#c4b5fd" font-size="9">α Best · β Edge · γ Novel</text>
    <text y="75" text-anchor="middle" fill="#a78bfa" font-size="9" opacity="0.8">DESTRUCT_RESULT</text>
  </g>

  <!-- Phase 2: GATHER -->
  <g transform="translate(560 240)">
    <rect x="-75" y="-55" width="150" height="110" rx="10" fill="url(#p2)" filter="url(#glow3)"/>
    <rect x="-70" y="-50" width="140" height="100" rx="8" fill="#0a0a1f" stroke="#67e8f9" stroke-width="1.5"/>
    <text y="-25" text-anchor="middle" fill="#67e8f9" font-size="10" font-weight="700" letter-spacing="1.5">PHASE 2</text>
    <text y="-5" text-anchor="middle" fill="#a5f3fc" font-size="16" font-weight="700">GATHER</text>
    <text y="15" text-anchor="middle" fill="#67e8f9" font-size="8" letter-spacing="1.5">[PHASE_2_GATHER]</text>
    <text y="35" text-anchor="middle" fill="#a5f3fc" font-size="9">AST · codegraph · filter</text>
    <text y="75" text-anchor="middle" fill="#67e8f9" font-size="9" opacity="0.8">GATHER_RESULT</text>
  </g>

  <!-- Phase 3: HYPERPLAN (Crucible - bigger) -->
  <g transform="translate(820 240)">
    <rect x="-95" y="-75" width="190" height="150" rx="12" fill="url(#p3)" filter="url(#bigGlow3)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="-90" y="-70" width="180" height="140" rx="10" fill="#0a0a1f" stroke="#fbbf24" stroke-width="2"/>
    <text y="-45" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="2">PHASE 3 · CRUCIBLE</text>
    <text y="-20" text-anchor="middle" fill="#fde68a" font-size="22" font-weight="700" filter="url(#glow3)">HYPERPLAN</text>
    <text y="-2" text-anchor="middle" fill="#fbbf24" font-size="9" letter-spacing="1.5">[PHASE_3_HYPERPLAN]</text>
    <text y="20" text-anchor="middle" fill="#fde68a" font-size="10">Builder ✕ Destroyer</text>
    <text y="36" text-anchor="middle" fill="#fde68a" font-size="9" opacity="0.8">S = Σ wᵢ · cᵢ  (3-round limit)</text>
    <text y="56" text-anchor="middle" fill="#fbbf24" font-size="9" letter-spacing="1">HYPERPLAN_RESULT</text>
  </g>

  <!-- Phase 4: SYNTHESIS -->
  <g transform="translate(1100 240)">
    <rect x="-75" y="-55" width="150" height="110" rx="10" fill="url(#p4)" filter="url(#glow3)"/>
    <rect x="-70" y="-50" width="140" height="100" rx="8" fill="#0a0a1f" stroke="#86efac" stroke-width="1.5"/>
    <text y="-25" text-anchor="middle" fill="#86efac" font-size="10" font-weight="700" letter-spacing="1.5">PHASE 4</text>
    <text y="-5" text-anchor="middle" fill="#bbf7d0" font-size="16" font-weight="700">SYNTHESIS</text>
    <text y="15" text-anchor="middle" fill="#86efac" font-size="8" letter-spacing="1.5">[PHASE_4_SYNTHESIS]</text>
    <text y="35" text-anchor="middle" fill="#bbf7d0" font-size="9">ADR · Spec · TDD plan</text>
    <text y="75" text-anchor="middle" fill="#86efac" font-size="9" opacity="0.8">SYSTEM_SPECIFICATION</text>
  </g>

  <!-- Phase 5: DYNAMIC_COMPILE (7-step swarm) - bottom row -->
  <g transform="translate(700 540)">
    <rect x="-180" y="-65" width="360" height="130" rx="12" fill="url(#p1)" filter="url(#glow3)"/>
    <rect x="-175" y="-60" width="350" height="120" rx="10" fill="#0a0a1f" stroke="#a78bfa" stroke-width="2"/>
    <text y="-35" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="2">PHASE 5 · 7-STEP SWARM</text>
    <text y="-10" text-anchor="middle" fill="#c4b5fd" font-size="20" font-weight="700" filter="url(#glow3)">DYNAMIC_COMPILE</text>
    <text y="8" text-anchor="middle" fill="#a78bfa" font-size="9" letter-spacing="1.5">[PHASE_DYNAMIC_COMPILE]</text>
    <text y="26" text-anchor="middle" fill="#c4b5fd" font-size="9">① Gather → ② Tri-Dim → ③ DAG → ④ Sandbox → ⑤ Dev → ⑥ Review → ⑦ Report</text>
    <text y="46" text-anchor="middle" fill="#a78bfa" font-size="9" opacity="0.8">REVIEW_RESULT · TASK_SUMMARY_REPORT</text>
  </g>

  <!-- Connection lines main flow -->
  <g fill="none" stroke-width="2" filter="url(#glow3)">
    <!-- IG -> P1 -->
    <path d="M180,210 L240,225" stroke="#fda4af" opacity="0.7" stroke-dasharray="4 3"/>
    <polygon points="240,225 232,221 234,229" fill="#fda4af"/>

    <!-- P1 -> P2 -->
    <path d="M395,240 L485,240" stroke="#67e8f9" opacity="0.8"/>
    <polygon points="485,240 477,236 477,244" fill="#67e8f9"/>
    <circle r="3" fill="#fff">
      <animateMotion dur="2s" repeatCount="indefinite" path="M395,240 L485,240"/>
    </circle>

    <!-- P2 -> P3 -->
    <path d="M635,240 L725,240" stroke="#fbbf24" opacity="0.8"/>
    <polygon points="725,240 717,236 717,244" fill="#fbbf24"/>
    <circle r="3" fill="#fff">
      <animateMotion dur="2s" repeatCount="indefinite" path="M635,240 L725,240"/>
    </circle>

    <!-- P3 -> P4 -->
    <path d="M915,240 L1025,240" stroke="#86efac" opacity="0.8"/>
    <polygon points="1025,240 1017,236 1017,244" fill="#86efac"/>
    <circle r="3" fill="#fff">
      <animateMotion dur="2s" repeatCount="indefinite" path="M915,240 L1025,240"/>
    </circle>

    <!-- P4 -> P5 -->
    <path d="M1100,295 L1100,420 Q1100,475 880,540" stroke="#a78bfa" opacity="0.8"/>
    <polygon points="880,540 884,533 891,539" fill="#a78bfa"/>
    <circle r="3" fill="#fff">
      <animateMotion dur="2.5s" repeatCount="indefinite" path="M1100,295 L1100,420 Q1100,475 880,540"/>
    </circle>
  </g>

  <!-- Crucible loopback (FAILED -> P2) -->
  <g fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.85">
    <path d="M820,165 Q820,80 700,80 Q580,80 560,165" filter="url(#glow3)"/>
    <polygon points="560,165 565,158 568,166" fill="#dc2626"/>
  </g>
  <text x="700" y="68" text-anchor="middle" fill="#f87171" font-size="9" letter-spacing="2" font-weight="600">FAILED → ADJUST (loop, max 3 rounds)</text>

  <!-- Arc from P5 back to P1 (re-entry) -->
  <g fill="none" stroke="#5b8cff" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.5">
    <path d="M520,540 Q300,720 200,720 Q140,720 140,260" filter="url(#glow3)"/>
    <polygon points="140,260 136,268 144,268" fill="#5b8cff"/>
  </g>
  <text x="320" y="745" fill="#5b8cff" font-size="9" letter-spacing="2" opacity="0.7" font-weight="600">CONTINUATION: write to boulder-state · next task → INTENT_GATE</text>

  <!-- Sub-agents row under Phase 5 -->
  <g transform="translate(700 660)">
    <g transform="translate(-260 0)">
      <circle r="22" fill="#0a0a1f" stroke="#3b82f6" stroke-width="1.2" filter="url(#glow3)"/>
      <text text-anchor="middle" y="3" fill="#3b82f6" font-size="9" font-weight="700">DEV</text>
      <text y="38" text-anchor="middle" fill="#3b82f6" font-size="8">Claude</text>
    </g>
    <g transform="translate(-130 0)">
      <circle r="22" fill="#0a0a1f" stroke="#dc2626" stroke-width="1.2" filter="url(#glow3)"/>
      <text text-anchor="middle" y="3" fill="#dc2626" font-size="9" font-weight="700">REV</text>
      <text y="38" text-anchor="middle" fill="#dc2626" font-size="8">Reviewer</text>
    </g>
    <g transform="translate(0 0)">
      <circle r="22" fill="#0a0a1f" stroke="#a78bfa" stroke-width="1.2" filter="url(#glow3)"/>
      <text text-anchor="middle" y="3" fill="#a78bfa" font-size="9" font-weight="700">TST</text>
      <text y="38" text-anchor="middle" fill="#a78bfa" font-size="8">TDD</text>
    </g>
    <g transform="translate(130 0)">
      <circle r="22" fill="#0a0a1f" stroke="#86efac" stroke-width="1.2" filter="url(#glow3)"/>
      <text text-anchor="middle" y="3" fill="#86efac" font-size="9" font-weight="700">FIX</text>
      <text y="38" text-anchor="middle" fill="#86efac" font-size="8">Remediator</text>
    </g>
    <g transform="translate(260 0)">
      <circle r="22" fill="#0a0a1f" stroke="#fbbf24" stroke-width="1.2" filter="url(#glow3)"/>
      <text text-anchor="middle" y="3" fill="#fbbf24" font-size="9" font-weight="700">RPT</text>
      <text y="38" text-anchor="middle" fill="#fbbf24" font-size="8">Reporter</text>
    </g>
  </g>

  <!-- State legend -->
  <g transform="translate(60 820)">
    <text fill="#5b8cff" font-size="10" letter-spacing="2" opacity="0.8">⏵ Deterministic transition: every hook outputs STRICTLY in its XML tag · no extra chat · tool calls anonymized as "subagent"</text>
  </g>

  <!-- Corner frame -->
  <g stroke="#5b8cff" stroke-width="1" fill="none" opacity="0.4">
    <path d="M30,30 L30,80 M30,30 L80,30"/>
    <path d="M1370,30 L1370,80 M1370,30 L1320,30"/>
    <path d="M30,870 L30,820 M30,870 L80,870"/>
    <path d="M1370,870 L1370,820 M1370,870 L1320,870"/>
  </g>
</svg>
